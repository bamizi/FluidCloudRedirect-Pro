name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 上下文在 step 的 if 里不可用(条件永远为假),必须经 job 级 env 中转
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程要求 JDK 25：gradle/gradle-daemon-jvm.properties 里 toolchainVersion=25，
      # AGP 9.x 也需要较新的 JDK。版本对不上会直接构建失败。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # runner 镜像自带 Android SDK(ANDROID_HOME=/usr/local/lib/android/sdk)。
      # 不再用 android-actions/setup-android@v3:该步骤实测直接失败、后续全被跳过,
      # 而 runner 自带的 SDK 够用——少一个第三方 action 就少一处不确定。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          ls "$SDK"

      # compileSdk 37 对应的平台目录是 android-37.0。
      # 公共 SDK 仓库里**没有** "platforms;android-37",只有 37.0 / 37.1 / 37.2,
      # 包名写错会一直 skip,然后 Gradle 报 "failed to find target with hash string android-37"。
      - name: Install Android platform 37.0
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK" --install "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --sdk_root="$SDK" --list_installed

      # ⚠️ 必须让 debug 钥匙库在多次构建之间保持同一把，否则**每版签名都不同**，
      # 用户无法覆盖安装升级，只能卸载重装（LSPosed 激活与配置也一起没）。
      # 实测过的指纹：v1.2.5 5b4af133… / v1.2.6 5b95cfb7… / v1.2.7(首版) 4b49d339…
      #
      # 单纯缓存 ~/.android 无效：AGP 在 runner 上并不用那个位置，
      # 缓存下来只有 365 字节（几乎空目录），钥匙压根没被保存。
      # 所以改成：工作区内固定路径 + 由本 workflow 生成 + 显式传给 Gradle（DEBUG_KEYSTORE）。
      # 关键点：cache 是按 ref 分作用域的。若让每个 tag 各自 save，就会出现
      # "main 一把、v1.2.7 一把、v1.2.8 又去读 main 那把"的错位，签名照样每版都变。
      # 所以拆成 restore / save 两步：所有 ref 都从默认分支还原，且只有 main 允许保存，
      # 全局只有一把 debug 钥匙。
      - name: Restore debug keystore
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci-debug
          key: debug-keystore-v4

      - name: Prepare debug keystore
        if: env.KEYSTORE_B64 == ''
        run: |
          KS="$GITHUB_WORKSPACE/.ci-debug/debug.keystore"
          mkdir -p "$GITHUB_WORKSPACE/.ci-debug"
          if [ ! -f "$KS" ]; then
            echo "no cached keystore; generating a new one (only this run changes the signature)"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "cached keystore found; reusing it"
          fi
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass android 2>/dev/null | grep -m1 'SHA256:' || true

      # 只在默认分支保存。key 已存在时 save 可能报冲突，但那不影响构建结果，故 continue-on-error。
      - name: Save debug keystore
        if: env.KEYSTORE_B64 == '' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ci-debug
          key: debug-keystore-v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 单元测试先跑,逻辑改动挂了能立刻在 CI 上看到
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # 配了 release keystore 就只出 release 包，避免同一页面挂着两个签名不同的 APK
      - name: Assemble debug APK
        if: env.KEYSTORE_B64 == ''
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # ---- 以下为可选的 release 签名 ----
      # 仓库 Settings → Secrets and variables → Actions 里配置：
      #   KEYSTORE_B64       release.keystore 的 base64（base64 -w0 release.keystore）
      #   KEYSTORE_PASSWORD  storePassword
      #   KEY_ALIAS          keyAlias
      #   KEY_PASSWORD       keyPassword
      # 没配这几个 secret 时自动跳过，只出 debug APK（LSPosed 认，只是升级时必须同签名）。
      - name: Restore keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release APK
        if: env.KEYSTORE_B64 != ''
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # R8 版:额外产出一个开了缩减+混淆的包,与普通版一起发布,由用户自己选。
      # 与普通版同签名同 applicationId,所以能互相覆盖安装。
      # keep 规则在 app/src/main/keepRules/rules.keep —— java_init.list 里的入口类
      # 在代码里零引用,不 keep 会被 R8 当死代码删掉,模块直接不加载。
      - name: Assemble R8 APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleR8 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # 产物统一改名成 FluidCloudRedirect-Pro-<版本>.apk 与 ...-<版本>-r8.apk。
      # 原因:Gradle 的默认产物永远叫 app-debug.apk / app-release.apk,下载到手机文件夹里
      # 几个版本全重名,既分不清谁新谁旧,也没法一眼看出装的哪一版。
      # 版本号从 build.gradle.kts 的 versionName 取,和 module.prop 里的 version 由同一处维护。
      - name: Rename APK with version
        run: |
          set -eo pipefail
          shopt -s nullglob
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VER" ]; then
            echo "::error::cannot read versionName from app/build.gradle.kts"
            exit 1
          fi
          # 普通版:配了 release keystore 出 release,否则出 debug,按实际存在的取
          dbg=(app/build/outputs/apk/debug/*.apk)
          rel=(app/build/outputs/apk/release/*.apk)
          r8apk=(app/build/outputs/apk/r8/*.apk)
          SRC_MAIN="${dbg[0]:-${rel[0]:-}}"
          SRC_R8="${r8apk[0]:-}"
          if [ -z "$SRC_MAIN" ] || [ -z "$SRC_R8" ]; then
            echo "::error::missing APK (main='$SRC_MAIN' r8='$SRC_R8'); tree follows"
            find app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi
          OUT_MAIN="FluidCloudRedirect-Pro-${VER}.apk"
          OUT_R8="FluidCloudRedirect-Pro-${VER}-r8.apk"
          cp "$SRC_MAIN" "$OUT_MAIN"
          cp "$SRC_R8" "$OUT_R8"
          # 自检:改完名字的文件必须存在且非空,否则后面 upload-artifact 会报 "no files found"
          test -s "$OUT_MAIN"
          test -s "$OUT_R8"
          echo "APK_OUT=$OUT_MAIN" >> "$GITHUB_ENV"
          echo "APK_OUT_R8=$OUT_R8" >> "$GITHUB_ENV"
          echo "APK_VER=$VER" >> "$GITHUB_ENV"
          echo "renamed: $SRC_MAIN -> $OUT_MAIN ($(stat -c%s "$OUT_MAIN") bytes)"
          echo "renamed: $SRC_R8 -> $OUT_R8 ($(stat -c%s "$OUT_R8") bytes)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APK_VER }}-${{ github.run_number }}
          path: |
            ${{ env.APK_OUT }}
            ${{ env.APK_OUT_R8 }}
          if-no-files-found: error

      # R8 会混淆,保留 mapping 才能在用户贴崩溃日志时还原到具体行。
      # 不挂在 Release 上(对普通用户没意义),只作为 Actions 产物留档。
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.APK_VER }}-${{ github.run_number }}
          path: app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore

      # 构建失败时把 Gradle 的报错以 ::error:: 输出。
      # 为什么要这一步:Actions 日志接口需要管理员权限,匿名读不到;
      # 而 ::error:: 会进 check-run 的 annotations,是公开可读的。
      # 这样定位编译错误不用再人工翻日志或截图。
      - name: Summarise Gradle failures
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::No gradle.log captured (the failure happened before Gradle ran)"
            exit 0
          fi
          OUT=/tmp/gradle-errors.txt
          : > "$OUT"
          # 1) 编译错误：Kotlin 可能写成 "e: file:///x.kt:12:5 ..."，也可能写成 "x.kt:12:5: error: ..."
          grep -m 40 -E "^(e|w): |\.kt:[0-9]+:[0-9]+" "$LOG" >> "$OUT" 2>/dev/null
          # 2) Gradle 失败摘要
          grep -m 6 -A 6 "What went wrong" "$LOG" >> "$OUT" 2>/dev/null
          grep -m 4 -E "^FAILURE: |^Execution failed for task|^> " "$LOG" >> "$OUT" 2>/dev/null
          # 3) 兜底：截尾
          if [ ! -s "$OUT" ]; then
            tail -n 150 "$LOG" >> "$OUT"
          fi
          # 按优先级输出（不排序，避免把编译错误排到后面被截掉）
          head -n 50 "$OUT" | tr -d "\r" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error::${line}"
          done

      # 把签名指纹取出来写进 Release 说明：用户和作者都能一眼看出"这次的包能不能覆盖上一版"。
      # 不用去翻 Actions 日志（那些要登录才能看），Release 页面本身就是公开的凭证。
      # 两个包必须同签名,否则普通版和 R8 版无法互相覆盖安装,这里直接断死。
      - name: Resolve APK signature
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          FP_MAIN=""
          FP_R8=""
          if [ -n "$APKSIGNER" ]; then
            FP_MAIN=$("$APKSIGNER" verify --print-certs "$APK_OUT" 2>/dev/null | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            FP_R8=$("$APKSIGNER" verify --print-certs "$APK_OUT_R8" 2>/dev/null | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          fi
          echo "APK_CERT_SHA256=$FP_MAIN" >> "$GITHUB_ENV"
          echo "APK_CERT_SHA256_R8=$FP_R8" >> "$GITHUB_ENV"
          echo "main : $FP_MAIN"
          echo "r8   : $FP_R8"
          if [ -n "$FP_MAIN" ] && [ -n "$FP_R8" ] && [ "$FP_MAIN" != "$FP_R8" ]; then
            echo "::error::普通版与 R8 版签名不一致,两者无法互相覆盖安装"
            exit 1
          fi

      # 打 tag（例如 v1.2.5）推送后，自动把 APK 挂到 Release 上。
      # body 里必须写源码链接：GPL-3.0 §6 要求分发二进制时同时提供对应源码。
      # 不写的话，每个 Release 都得手动补一次，迟早漏。
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_OUT }}
            ${{ env.APK_OUT_R8 }}
          generate_release_notes: true
          body: |
            ## 两个包,选一个装

            | 文件 | 说明 | 适合谁 |
            |---|---|---|
            | `FluidCloudRedirect-Pro-${{ env.APK_VER }}.apk` | 普通版,未做 R8 处理 | 默认装这个;出问题好排查 |
            | `FluidCloudRedirect-Pro-${{ env.APK_VER }}-r8.apk` | R8 版,代码缩减+混淆,体积更小 | 想要更小的包、或者不想让人随手反编译 |

            两个包**同签名、同 applicationId、同 versionCode**，所以可以互相覆盖安装，随时换回来。
            功能完全一致；R8 版若出现异常，先用普通版复现一次，能区分是"功能问题"还是"混淆引起的问题"。

            ## 安装

            1. 下载上面任意一个 APK 安装（需已装好并启用 LSPosed）
            2. LSPosed 中启用本模块，作用域勾选「智慧决策服务」（`com.oplus.metis`）
            3. **给 metis 开后台启动资格**（否则点卡片会「完全没反应」）：
               ```sh
               su -c cmd appops set com.oplus.metis SYSTEM_ALERT_WINDOW allow
               ```
               原理与排障见 README「必须做：SYSTEM_ALERT_WINDOW」一节
            4. **停一次 `com.oplus.metis` 或重启手机**，钩子才会加载
            5. 设置页选一个浏览器；「应用替换」里填 `com.quark.browser → com.quark.clouddrive`，
               之后复制夸克分享口令点卡片就会打开夸克网盘

            ## 源码

            本版本对应源码（GPL-3.0 §6）：
            https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}

            本项目是 [FluidCloudRedirect](https://github.com/wangliaoqiongchen/FluidCloudRedirect)
            的衍生作品，**不是原作者发布的版本**，原作者不对本版本提供支持或背书。
            修改内容与日期见仓库内 `NOTICE`，逐版变更见 `CHANGELOG-PRO.md`。

            > 签名说明：本包与作者本机构建的同版本包签名不同，两者不能互相覆盖安装。
            >
            > 本包签名证书 SHA-256（普通版 / R8 版一致）：`${{ env.APK_CERT_SHA256 }}`
            >
            > 升级前对照上一版 Release 里的这一行：**相同就能直接覆盖安装**，
            > 不同则需先卸载（LSPosed 激活与配置要重配一次）。
